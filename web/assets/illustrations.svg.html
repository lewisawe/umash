<!--
  Umash imagery — inline SVG illustrations.
  Dignified, quiet line art in the Sana system: ink line on frost/paper,
  a single restrained lime accent, flat, no shadows, 24px-friendly framing.
  Documentary-register motifs (dawn horizon, a held hand, a candle, a tree,
  a folded letter) rather than anything morbid. These always render offline;
  photographic sources are layered on top with graceful fallback in imagery.css.

  This file is a reference library — the markup is copied inline where used so
  each page stays self-contained. Kept here for maintenance.
-->

<!-- HERO: dawn over a horizon — the morning after -->
<svg id="art-dawn" viewBox="0 0 800 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A quiet dawn over a horizon">
  <rect width="800" height="360" fill="#e4eff7"/>
  <circle cx="400" cy="250" r="86" fill="#cdfe00" opacity="0.9"/>
  <line x1="0" y1="250" x2="800" y2="250" stroke="#0a1217" stroke-width="1.5"/>
  <path d="M120 250c40-8 70-6 110 2s70 10 120 2 90-14 140-6 110 12 190 2" stroke="#0a1217" stroke-width="1.5" opacity="0.4"/>
  <path d="M60 250c30-4 40 0 60 3" stroke="#0a1217" stroke-width="1.5" opacity="0.25"/>
</svg>

</svg>

<!-- TREE: continuity, growth after loss -->
<svg id="art-tree" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A single tree">

  <circle cx="112" cy="72" r="4" fill="#cdfe00"/>
</svg>
